repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.7.22
    hooks:
      - id: uv-lock
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: ty-check
        name: ty type check
        entry: uv run python3 scripts/ty_check.py
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        verbose: true
      - id: legacy-imports-guard
        name: legacy imports guard
        entry: uv run pytest tests/test_no_unapproved_legacy_imports.py -v
        language: system
        pass_filenames: false
        stages: [pre-commit]
