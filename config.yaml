# SQLMesh project configuration for binance-datatool.
# Connects to the same DuckDB database used by dlt and the existing sink.
# Path is relative to project root. Must match the catalog.duckdb location
# used by dlt pipeline (see pipeline.py) and Prefect flows.
# See: https://sqlmesh.readthedocs.io/en/stable/guides/setup/

gateways:
  local:
    connection:
      type: duckdb
      database: lake/catalog.duckdb
      extensions:
        - parquet
        - json

default_target_environment: prod

model_defaults:
  dialect: duckdb
  start: 2026-01-01
